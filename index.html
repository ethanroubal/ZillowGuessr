<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZillowGuessr</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>ZillowGuessr</h1>
      <p>Two modes: guess the price from map clues, or guess the location from listing clues.</p>
    </header>

    <main>
      <section id="auth-card" class="card">
        <h2>Start Game</h2>
        <p>Create a quick profile, then choose your mode.</p>

        <div class="mode-picker" id="mode-picker">
          <button type="button" class="mode-btn active" data-mode="price">
            🏷️ Price Mode
            <span>Guess price from map clue.</span>
          </button>
          <button type="button" class="mode-btn" data-mode="location">
            📍 Location Mode
            <span>Guess map location from price + photos.</span>
          </button>
        </div>

        <form id="auth-form" class="inline-form">
          <label for="username">Username</label>
          <input id="username" name="username" required maxlength="20" />
          <button type="submit">Sign In / Create</button>
        </form>
        <p id="auth-status" class="status"></p>
      </section>

      <section id="game-card" class="card hidden">
        <div class="game-header">
          <div>
            <h2 id="welcome"></h2>
            <p id="round-label">Round 1 / 20</p>
            <p id="mode-label" class="small-note"></p>
          </div>
          <div class="game-actions">
            <div class="score-box">
              <span>Total Score</span>
              <strong id="total-score">0</strong>
            </div>
            <div class="mode-switcher"><button class="ghost in-game-mode-btn" data-mode="price" type="button">Price</button><button class="ghost in-game-mode-btn" data-mode="location" type="button">Location</button></div>
          </div>
        </div>

        <article class="listing">
          <img id="house-image" alt="House listing" />
          <div class="listing-details">
            <h3 id="listing-address"></h3>
            <p id="listing-meta"></p>
          </div>
        </article>

        <div id="map"></div>
        <p class="small-note" id="mode-instructions"></p>

        <form id="guess-form" class="inline-form hidden">
          <label for="price-guess">Your Price Guess ($)</label>
          <input
            id="price-guess"
            name="priceGuess"
            type="number"
            min="10000"
            step="1000"
            required
          />
          <button type="submit">Submit Price Guess</button>
        </form>

        <div id="location-controls" class="inline-form hidden">
          <label>Drop a map pin, then submit.</label>
          <button id="submit-location-guess" type="button">Submit Location Guess</button>
        </div>

        <div id="round-result" class="result"></div>
        <button id="next-round" class="hidden">Next Round</button>
      </section>

      <section id="leaderboard-card" class="card">
        <div class="leaderboard-head">
          <h2>Leaderboard</h2>
          <button id="clear-leaderboard" class="ghost">Clear</button>
        </div>
        <ol id="leaderboard-list"></ol>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
